<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="city-input" 
                    class="search-input" 
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
                <button id="search-btn" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
                <button id="location-btn" class="location-btn" title="Use my location">
                    <i class="fas fa-location-dot"></i>
                </button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </section>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error hidden"></div>

        <!-- Current Weather -->
        <section id="current-weather" class="weather-card hidden">
            <div class="weather-header">
                <div class="location-info">
                    <h2 id="city-name"></h2>
                    <p id="current-date"></p>
                </div>
                <div class="weather-icon">
                    <img id="weather-icon" src="" alt="Weather icon">
                </div>
            </div>
            
            <div class="weather-main">
                <div class="temperature">
                    <span id="temp" class="temp-value"></span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="weather-description">
                    <p id="description"></p>
                    <p id="feels-like"></p>
                </div>
            </div>
            
            <div class="weather-details">
                <div class="detail">
                    <i class="fas fa-droplets"></i>
                    <div>
                        <p class="detail-label">Humidity</p>
                        <p id="humidity" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-wind"></i>
                    <div>
                        <p class="detail-label">Wind Speed</p>
                        <p id="wind-speed" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-gauge"></i>
                    <div>
                        <p class="detail-label">Pressure</p>
                        <p id="pressure" class="detail-value"></p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-eye"></i>
                    <div>
                        <p class="detail-label">Visibility</p>
                        <p id="visibility" class="detail-value"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Forecast Section -->
        <section id="forecast-section" class="forecast-section hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecast" class="forecast-grid"></div>
        </section>

        <!-- Favorites -->
        <section id="favorites-section" class="favorites-section">
            <h3>Favorite Cities</h3>
            <div id="favorites" class="favorites-grid"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
